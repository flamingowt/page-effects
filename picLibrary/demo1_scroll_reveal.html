<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>材料库 - 滚动渐显 + 详情翻转 (Scroll Reveal + Flip)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        .header {
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }
        .header h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            font-size: 1.2rem;
            color: #888;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 1;
            opacity: 0; /* 初始隐藏，由GSAP控制 */
            transform: translateY(50px);
            cursor: pointer;
            background-color: #222;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px; /* 自身带圆角，脱离裁剪时依然圆润 */
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        .gallery-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            pointer-events: none; /* 让点击穿透给图片 */
        }
        .gallery-item:hover .overlay {
            transform: translateY(0);
        }

        /* 详情视图 (全屏) */
        .detail-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85); /* 降低透明度 */
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.5s ease; /* 增加透明度渐变过渡，关闭时不那么生硬 */
        }
        .detail-view.active {
            opacity: 1;
            pointer-events: auto;
        }
        .detail-content {
            width: 80vw;
            height: 80vh;
            max-width: 1200px;
            display: flex;
            gap: 50px;
            align-items: center;
        }
        .detail-image-container {
            width: 45%;
            aspect-ratio: 1; /* 强制1:1正方形，与缩略图比例一致，根除动画抖动 */
            height: auto;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .detail-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 统一使用 cover */
            border-radius: 16px; /* 大图状态的圆角 */
        }
        .detail-text {
            width: 50%;
            opacity: 0;
            transform: translateX(30px);
        }
        .detail-text h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #feca57;
        }
        .detail-text p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 10px;
        }
        .no-transition {
            transition: none !important;
        }
    </style>
</head>

        const basePath = '/Users/dufangchi/Documents/材料库raw_resize/小花砖/';
        const gallery = document.getElementById('gallery');
        const detailView = document.getElementById('detail-view');
        const detailImageContainer = document.getElementById('detail-image-container');
        const detailText = document.getElementById('detail-text');
        const detailTitle = document.getElementById('detail-title');

        // 1. 动态生成网格
        images.forEach((imgName, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            
            const img = document.createElement('img');
            img.src = basePath + imgName;
            img.dataset.name = `精品花砖 序列号 00${index + 1}`;
            
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `<span style="font-weight: bold; color: white;">点击查看详情</span>`;

            item.appendChild(img);
            item.appendChild(overlay);
            gallery.appendChild(item);
        });

        // 2. 绑定 ScrollTrigger 滚动渐显动画
        const items = gsap.utils.toArray('.gallery-item');
        
        items.forEach((item) => {
            gsap.to(item, {
                scrollTrigger: {
                    trigger: item,
                    start: "top 95%", 
                    // 使用 play none none none 确保翻转时不发生突变
                    toggleActions: "play none none none" 
                },
                opacity: 1,
                y: 0,
                duration: 0.8,
                ease: "power3.out"
            });
        });

        // 3. 绑定 Flip 翻转详情逻辑
        let activeImage = null; 
        let activeThumbContainer = null;

        items.forEach((item) => {
            const img = item.querySelector('img');
            
            item.addEventListener('click', () => {
                if (activeImage) return; // 防止重复点击
                
                activeImage = img;
                activeThumbContainer = item;
                detailTitle.textContent = img.dataset.name;

                // 移除hover放大状态带来的干扰，回归初始比例，并禁用CSS transition
                gsap.set(activeImage, { clearProps: "transform" });
                activeImage.classList.add('no-transition');

                // 记录 Flip 初始状态
                const state = Flip.getState(activeImage);

                // 将图片从网格DOM移入详情弹窗DOM
                detailImageContainer.appendChild(activeImage);
                detailView.classList.add('active');
                
                // 为了防止滚动穿透导致位置偏差，可暂时禁止body滚动
                document.body.style.overflow = 'hidden';

                // 播放 Flip 过渡动画
                Flip.from(state, {
                    duration: 0.7,
                    ease: "power3.inOut",
                    absolute: true,
                    props: "borderRadius",
                    onComplete: () => {
                        // 翻转完成后，文字划入
                        gsap.to(detailText, { opacity: 1, x: 0, duration: 0.4 });
                    }
                });
            });
        });

        // 4. 关闭详情页逻辑
        detailView.addEventListener('click', () => {
            if (!activeImage) return;

            // 文字滑出
            gsap.to(detailText, { opacity: 0, x: 30, duration: 0.2 });
            detailView.classList.remove('active');
            
            // 恢复滚动
            document.body.style.overflow = '';

            // 关闭前确保仍然禁用 CSS transition
            activeImage.classList.add('no-transition');
            
            // 为了防止 hover 在结束瞬间触发导致突变，先给网格项加上禁用事件的样式
            activeThumbContainer.style.pointerEvents = 'none';
            // 【关键修复】防止返回时被容器的 overflow: hidden 裁剪导致在格子里才有动画
            // 且 zIndex 必须大于 1000（detail-view 的层级），否则图片会瞬间被黑色遮罩盖住产生“闪黑”
            activeThumbContainer.style.overflow = 'visible';
            activeThumbContainer.style.zIndex = '1001';

            // 记录当前大图状态
            const state = Flip.getState(activeImage);

            // 放回网格原来的容器内
            activeThumbContainer.appendChild(activeImage);

            // 逆向执行 Flip 动画
            Flip.from(state, {
                duration: 0.7,
                ease: "power3.inOut",
                absolute: true,
                props: "borderRadius",
                onComplete: () => {
                    // 动画完全结束后，恢复元素的 CSS 样式
                    gsap.set(activeImage, { clearProps: "all" });
                    activeImage.classList.remove('no-transition');
                    activeThumbContainer.style.pointerEvents = ''; // 恢复 hover
                    activeThumbContainer.style.overflow = '';
                    activeThumbContainer.style.zIndex = '';
                    activeImage = null;
                }
            });
        });
