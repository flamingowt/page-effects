<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSeeHome Particle Text Interaction</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #faf8f5; 
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            transition: background-color 0.3s;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0, 0, 0, 0.4);
            pointer-events: none;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        /* Control Panel Styles */
        #controls {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: 1px solid rgba(255,255,255,0.4);
            color: #333;
            z-index: 10;
            min-width: 180px;
        }
        #controls h3 {
            margin: 0 0 18px 0;
            font-size: 15px;
            font-weight: 600;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            padding-bottom: 10px;
            text-align: center;
        }
        .control-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }
        .control-group:last-child {
            margin-bottom: 0;
        }
        .control-group label {
            font-size: 12px;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            display: flex;
            justify-content: space-between;
        }
        .control-group input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #000;
        }
        .control-group input[type="color"] {
            width: 100%;
            height: 35px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            padding: 0;
            background: none;
        }
        .control-group input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .control-group input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div id="info">Hover the center area to reveal</div>
    <canvas id="canvas"></canvas>

    <!-- Control Panel -->
    <div id="controls">
        <h3>Particle Settings</h3>
        <div class="control-group">
            <label for="speedSlider"><span>Roam Speed</span> <span id="speedVal">1.00x</span></label>
            <input type="range" id="speedSlider" min="0.01" max="1.0" step="0.01" value="1.0">
        </div>
        <div class="control-group">
            <label for="internalSpeedSlider"><span>Internal Speed</span> <span id="internalSpeedVal">0.02x</span></label>
            <input type="range" id="internalSpeedSlider" min="0.01" max="1.0" step="0.01" value="0.02">
        </div>
        <div class="control-group">
            <label for="formSpeedSlider"><span>Form Speed</span> <span id="formSpeedVal">0.11x</span></label>
            <input type="range" id="formSpeedSlider" min="0.01" max="1.0" step="0.01" value="0.11">
        </div>
        <div class="control-group">
            <label for="triggerSlider"><span>Trigger Area</span> <span id="triggerVal">0px</span></label>
            <input type="range" id="triggerSlider" min="0" max="300" step="5" value="0">
        </div>
        <div class="control-group">
            <label for="mouseInfluenceSlider"><span>Mouse Repel</span> <span id="mouseInfluenceVal">15px</span></label>
            <input type="range" id="mouseInfluenceSlider" min="0" max="300" step="5" value="15">
        </div>
        <div class="control-group">
            <label for="sizeSlider"><span>Particle Size</span> <span id="sizeVal">1.2x</span></label>
            <input type="range" id="sizeSlider" min="0.1" max="3.0" step="0.1" value="1.2">
        </div>
        <div class="control-group">
            <label for="roamDensitySlider"><span>Roam Density</span> <span id="roamDensityVal">9</span></label>
            <input type="range" id="roamDensitySlider" min="1" max="10" step="1" value="9">
        </div>
        <div class="control-group">
            <label for="textDensitySlider"><span>Text Density</span> <span id="textDensityVal">9</span></label>
            <input type="range" id="textDensitySlider" min="1" max="10" step="1" value="9">
        </div>
        <div class="control-group">
            <label for="colorPicker">Particle Color</label>
            <input type="color" id="colorPicker" value="#7a9f9d">
        </div>
        <div class="control-group">
            <label for="bgColorPicker">Background Color</label>
            <input type="color" id="bgColorPicker" value="#faf8f5">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let width, height;
        let particles = [];
        let targetPoints = [];
        let textMap = new Uint8Array();
        let triggerArea = { x: 0, y: 0, width: 0, height: 0 };
        let roamArea = { x: 0, y: 0, width: 0, height: 0 };
        let textBounds = { minX: 0, maxX: 0, minY: 0, maxY: 0 };
        let isHoveringArea = false;
        let mouse = { x: -1000, y: -1000 };

        const word = "iseehome";

        // Global Control Variables
        let globalSpeedMultiplier = 1.0;
        let globalInternalSpeedMultiplier = 0.02;
        let globalFormSpeedMultiplier = 0.11;
        let globalTriggerPadding = 0;
        let globalMouseInfluenceRadius = 15;
        let globalSizeMultiplier = 1.2;
        
        let globalRoamDensity = 9;
        let globalTextDensity = 9;
        let currentMinGap = Math.min(12 - globalRoamDensity, 12 - globalTextDensity);

        let globalBaseColor = '#7a9f9d';
        let globalBgColor = '#faf8f5';
        let globalBgColorWithOpacity = 'rgba(250, 248, 245, 0.4)';

        // Helper to generate varied shades/opacity from a hex color
        function generateVariedColor(hex) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            
            const opacity = (Math.random() * 0.4 + 0.6).toFixed(2);
            return `rgba(${r}, ${g}, ${b}, ${opacity})`;
        }

        function hexToRgba(hex, alpha) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function updateTriggerArea() {
            triggerArea = {
                x: textBounds.minX - globalTriggerPadding,
                y: textBounds.minY - globalTriggerPadding,
                width: (textBounds.maxX - textBounds.minX) + globalTriggerPadding * 2,
                height: (textBounds.maxY - textBounds.minY) + globalTriggerPadding * 2
            };
        }

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            // 1. Draw text on canvas to get pixel data
            ctx.fillStyle = '#000';
            ctx.font = 'bold 150px "Arial Black", sans-serif'; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(word, width / 2, height / 2);

            // 2. Extract pixels
            const imgData = ctx.getImageData(0, 0, width, height).data;
            ctx.clearRect(0, 0, width, height);

            targetPoints = [];
            textMap = new Uint8Array(width * height);
            
            const gap = currentMinGap; 
            
            let minX = width, maxX = 0, minY = height, maxY = 0;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const index = (y * width + x) * 4;
                    const alpha = imgData[index + 3];
                    
                    if (alpha > 128) {
                        textMap[y * width + x] = 1; 
                        
                        if (x % gap === 0 && y % gap === 0) {
                            targetPoints.push({ x, y });
                            if(x < minX) minX = x;
                            if(x > maxX) maxX = x;
                            if(y < minY) minY = y;
                            if(y > maxY) maxY = y;
                        }
                    }
                }
            }
            
            // Save bounds
            textBounds = { minX, maxX, minY, maxY };

            // Trigger Area
            updateTriggerArea();

            // Roam Area: slightly larger area for particles to wander randomly
            const roamPadding = 60;
            roamArea = {
                x: minX - roamPadding,
                y: minY - roamPadding,
                width: (maxX - minX) + roamPadding * 2,
                height: (maxY - minY) + roamPadding * 2
            };

            // 3. Create particles
            particles = [];
            for (let i = 0; i < targetPoints.length; i++) {
                particles.push(new Particle(targetPoints[i]));
            }
        }

        class Particle {
            constructor(homeTarget) {
                this.homeX = homeTarget.x;
                this.homeY = homeTarget.y;
                
                this.x = roamArea.x + Math.random() * roamArea.width;
                this.y = roamArea.y + Math.random() * roamArea.height;
                
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                
                this.baseSize = Math.random() * 1.5 + 0.8;
                this.color = generateVariedColor(globalBaseColor);
                
                this.angle = Math.random() * Math.PI * 2;
                this.baseWanderSpeedOriginal = Math.random() * 2 + 1; 
                
                this.baseFlowSpeedOriginal = Math.random() * 5 + 3; 
                this.state = 'returning'; 
                
                // Opacity management for density control
                this.rank = Math.random();
                let currentGap = isHoveringArea ? (12 - globalTextDensity) : (12 - globalRoamDensity);
                let threshold = Math.pow(currentMinGap / currentGap, 2);
                this.opacity = this.rank <= threshold ? 1 : 0;
            }

            update() {
                // Update opacity based on current state and density settings
                let currentGap = isHoveringArea ? (12 - globalTextDensity) : (12 - globalRoamDensity);
                let threshold = Math.pow(currentMinGap / currentGap, 2);
                let targetOpacity = this.rank <= threshold ? 1 : 0;
                this.opacity += (targetOpacity - this.opacity) * 0.1;

                // Optimization: Don't calculate physics for fully invisible particles
                if (this.opacity < 0.01) return;

                const currentFlowSpeed = this.baseFlowSpeedOriginal * globalInternalSpeedMultiplier;
                const currentWanderSpeed = this.baseWanderSpeedOriginal * globalSpeedMultiplier;

                if (isHoveringArea) {
                    if (this.state !== 'flowing') {
                        const dx = this.homeX - this.x;
                        const dy = this.homeY - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < 3) {
                            this.state = 'flowing'; 
                            const startAngle = Math.random() * Math.PI * 2;
                            this.vx = Math.cos(startAngle) * currentFlowSpeed;
                            this.vy = Math.sin(startAngle) * currentFlowSpeed;
                        } else {
                            const springForce = 0.12 * globalFormSpeedMultiplier;
                            this.vx += dx * springForce;
                            this.vy += dy * springForce;
                            this.vx *= 0.8; 
                            this.vy *= 0.8;
                        }
                    } 
                    
                    if (this.state === 'flowing') {
                        this.vx += (Math.random() - 0.5) * 2 * globalInternalSpeedMultiplier;
                        this.vy += (Math.random() - 0.5) * 2 * globalInternalSpeedMultiplier;
                        
                        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                        if (speed > currentFlowSpeed) {
                            this.vx = (this.vx / speed) * currentFlowSpeed;
                            this.vy = (this.vy / speed) * currentFlowSpeed;
                        }

                        const mDx = this.x - mouse.x;
                        const mDy = this.y - mouse.y;
                        const mDist = Math.sqrt(mDx * mDx + mDy * mDy);
                        
                        const repelRadius = globalMouseInfluenceRadius;
                        if (mDist < repelRadius && repelRadius > 0) {
                            const force = (repelRadius - mDist) / repelRadius; 
                            const angle = Math.atan2(mDy, mDx);
                            this.vx += Math.cos(angle) * force * 5 * globalInternalSpeedMultiplier;
                            this.vy += Math.sin(angle) * force * 5 * globalInternalSpeedMultiplier;
                        }

                        const nextX = this.x + this.vx;
                        const nextY = this.y + this.vy;
                        const ix = Math.floor(nextX);
                        const iy = Math.floor(nextY);
                        
                        let insideText = false;
                        if (ix >= 0 && ix < width && iy >= 0 && iy < height) {
                            if (textMap[iy * width + ix] === 1) {
                                insideText = true;
                            }
                        }

                        if (!insideText) {
                            const dx = this.homeX - this.x;
                            const dy = this.homeY - this.y;
                            
                            this.vx += dx * 0.4;
                            this.vy += dy * 0.4;
                            this.vx *= 0.6; 
                            this.vy *= 0.6;
                        }
                    }
                    
                } else {
                    this.state = 'returning'; 
                    
                    this.angle += (Math.random() - 0.5) * 0.3 * globalSpeedMultiplier;
                    
                    this.vx += Math.cos(this.angle) * 0.5 * globalSpeedMultiplier;
                    this.vy += Math.sin(this.angle) * 0.5 * globalSpeedMultiplier;
                    
                    const mDx = this.x - mouse.x;
                    const mDy = this.y - mouse.y;
                    const mDist = Math.sqrt(mDx * mDx + mDy * mDy);
                    
                    const mouseInfluenceRadius = globalMouseInfluenceRadius * 2.5; 
                    if (mDist < mouseInfluenceRadius && mouseInfluenceRadius > 0) {
                        const force = (mouseInfluenceRadius - mDist) / mouseInfluenceRadius;
                        const mAngle = Math.atan2(mDy, mDx);
                        this.vx += Math.cos(mAngle) * force * 1.5 * globalSpeedMultiplier;
                        this.vy += Math.sin(mAngle) * force * 1.5 * globalSpeedMultiplier;
                    }

                    const boundaryForce = 0.15 * globalSpeedMultiplier;
                    if (this.x < roamArea.x) this.vx += boundaryForce;
                    if (this.x > roamArea.x + roamArea.width) this.vx -= boundaryForce;
                    if (this.y < roamArea.y) this.vy += boundaryForce;
                    if (this.y > roamArea.y + roamArea.height) this.vy -= boundaryForce;
                    
                    const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (currentSpeed > currentWanderSpeed) {
                        this.vx = (this.vx / currentSpeed) * currentWanderSpeed;
                        this.vy = (this.vy / currentSpeed) * currentWanderSpeed;
                    }
                }

                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                if (this.opacity < 0.01) return;
                
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.1, this.baseSize * globalSizeMultiplier), 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function animate() {
            ctx.fillStyle = globalBgColorWithOpacity;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }

            requestAnimationFrame(animate);
        }

        // Control Panel Event Listeners
        document.getElementById('speedSlider').addEventListener('input', (e) => {
            globalSpeedMultiplier = parseFloat(e.target.value);
            document.getElementById('speedVal').textContent = globalSpeedMultiplier.toFixed(2) + 'x';
        });

        document.getElementById('internalSpeedSlider').addEventListener('input', (e) => {
            globalInternalSpeedMultiplier = parseFloat(e.target.value);
            document.getElementById('internalSpeedVal').textContent = globalInternalSpeedMultiplier.toFixed(2) + 'x';
        });

        document.getElementById('formSpeedSlider').addEventListener('input', (e) => {
            globalFormSpeedMultiplier = parseFloat(e.target.value);
            document.getElementById('formSpeedVal').textContent = globalFormSpeedMultiplier.toFixed(2) + 'x';
        });

        document.getElementById('triggerSlider').addEventListener('input', (e) => {
            globalTriggerPadding = parseInt(e.target.value);
            document.getElementById('triggerVal').textContent = globalTriggerPadding + 'px';
            updateTriggerArea();
            checkHoverState();
        });

        document.getElementById('mouseInfluenceSlider').addEventListener('input', (e) => {
            globalMouseInfluenceRadius = parseInt(e.target.value);
            document.getElementById('mouseInfluenceVal').textContent = globalMouseInfluenceRadius + 'px';
        });

        document.getElementById('sizeSlider').addEventListener('input', (e) => {
            globalSizeMultiplier = parseFloat(e.target.value);
            document.getElementById('sizeVal').textContent = globalSizeMultiplier.toFixed(1) + 'x';
        });

        // Density Sliders
        document.getElementById('roamDensitySlider').addEventListener('input', (e) => {
            document.getElementById('roamDensityVal').textContent = e.target.value;
        });
        document.getElementById('roamDensitySlider').addEventListener('change', (e) => {
            globalRoamDensity = parseInt(e.target.value);
            let newMinGap = Math.min(12 - globalRoamDensity, 12 - globalTextDensity);
            if (newMinGap !== currentMinGap) {
                currentMinGap = newMinGap;
                init(); 
            }
        });

        document.getElementById('textDensitySlider').addEventListener('input', (e) => {
            document.getElementById('textDensityVal').textContent = e.target.value;
        });
        document.getElementById('textDensitySlider').addEventListener('change', (e) => {
            globalTextDensity = parseInt(e.target.value);
            let newMinGap = Math.min(12 - globalRoamDensity, 12 - globalTextDensity);
            if (newMinGap !== currentMinGap) {
                currentMinGap = newMinGap;
                init(); 
            }
        });

        document.getElementById('colorPicker').addEventListener('input', (e) => {
            globalBaseColor = e.target.value;
            particles.forEach(p => {
                p.color = generateVariedColor(globalBaseColor);
            });
        });

        document.getElementById('bgColorPicker').addEventListener('input', (e) => {
            globalBgColor = e.target.value;
            document.body.style.backgroundColor = globalBgColor;
            // Update the trailing effect color to match new background
            globalBgColorWithOpacity = hexToRgba(globalBgColor, 0.4);
        });

        // Window Event Listeners
        window.addEventListener('resize', () => {
            init();
        });

        function checkHoverState() {
            if (mouse.x >= triggerArea.x && mouse.x <= triggerArea.x + triggerArea.width &&
                mouse.y >= triggerArea.y && mouse.y <= triggerArea.y + triggerArea.height) {
                isHoveringArea = true;
            } else {
                isHoveringArea = false;
            }
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            checkHoverState();
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
            isHoveringArea = false;
        });

        // Start
        init();
        animate();
    </script>
</body>
</html>
